name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build onefile exe
        run: python -m PyInstaller --onefile --name screen-share --noconfirm screen-share.py

      - name: Smoke test (health + send/poll)
        shell: pwsh
        run: |
          Start-Process -FilePath "dist\screen-share.exe" -ArgumentList "--no-ui --port 8099" -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-RestMethod -Uri http://127.0.0.1:8099/health -TimeoutSec 3
              if ($r.ok) { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) { throw "exe 未能启动或 /health 不可用" }
          $body = '{"text":"ci test\n  indent"}'
          Invoke-RestMethod -Uri http://127.0.0.1:8099/send -Method Post `
            -ContentType "application/json; charset=utf-8" `
            -Body ([System.Text.Encoding]::UTF8.GetBytes($body)) | Out-Null
          $p = Invoke-RestMethod -Uri "http://127.0.0.1:8099/poll?after=0" -TimeoutSec 5
          if ($p.messages[0].text -ne "ci test`n  indent") { throw "消息回环失败" }
          Write-Host "smoke test passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-share-windows
          path: dist/screen-share.exe
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/screen-share.exe
          generate_release_notes: true

      # ---- 兜底：main 上的构建发到 nightly 预发布，随时可下最新包 ----
      - name: Move nightly tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly

      - name: Publish nightly prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: nightly · 最新 main 构建（非稳定版）
          body: |
            自动构建自 `main` 分支最新提交，仅供尝鲜，稳定版请看带版本号的 Release。

            - commit: `${{ github.sha }}`
            - 触发: ${{ github.event_name }} @ ${{ github.event.head_commit.timestamp }}
            - 产物: `screen-share.exe`（Windows 单文件，绿色免安装）
          prerelease: true
          make_latest: "false"
          overwrite_files: true
          files: dist/screen-share.exe
